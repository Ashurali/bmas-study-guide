<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Biosensor anatomy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#111832;--line:#26304d;--cyan:#4dd0c4;--amber:#f2b13c;--violet:#a78bfa;--red:#ef6a6a;--tx:#e8eeff;--dim:#8ea0c9}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0 auto;max-width:720px;padding:12px;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans",sans-serif}
svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
svg text{font-family:"IBM Plex Mono",monospace}
.layer{cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
button{font:600 14px "IBM Plex Sans",sans-serif;min-height:40px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}
button[data-l=recognizer]{color:var(--cyan)} button[data-l=interface]{color:var(--amber)} button[data-l=transducer]{color:var(--violet)}
button.on{background:rgba(255,255,255,.08);border-color:currentColor}
.cap{margin:8px 2px 4px;font-size:14px;min-height:1.5em}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--panel)}
li a,li span.l{font:600 12px "IBM Plex Mono",monospace;margin-left:6px}
li a{color:var(--cyan);display:inline-block;min-height:24px}
li span.l{color:var(--dim)}
.note{color:var(--dim);font-size:12px;margin:8px 2px 0}
</style>
</head>
<body>
<svg id="stack" viewBox="0 0 360 180" role="img" aria-label="Biosensor stack: recognizer on top, interface in the middle, transducer at the bottom"></svg>
<div class="row" role="tablist" aria-label="Layers">
  <button data-l="recognizer">Recognizer</button>
  <button data-l="interface">Interface</button>
  <button data-l="transducer">Transducer</button>
</div>
<p class="cap" id="cap"></p>
<ul id="members"></ul>
<p class="note">Biosensor = recognizer + interface + transducer (Chen, Li et al., Nano Today 2011). Lesson tags turn into links as lessons are built.</p>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(str, attrs, parent) { const t = el("text", attrs, parent); t.textContent = str; return t; }
const C = {cyan:"#4dd0c4", amber:"#f2b13c", violet:"#a78bfa", dim:"#8ea0c9", tx:"#e8eeff"};

// Lessons that are built (link targets relative to this file). Add one per finished lesson.
const READY = {L07: "../lessons/l07-pcr/"};
const LAYERS = {
  recognizer: {
    col: C.cyan,
    text: "Recognizer: grabs the target (the analyte) by its shape or its sequence.",
    members: [["Enzyme", ["L03"]], ["Bioreceptor", ["L03"]], ["Antibody", ["L03", "L06"]], ["Aptamer", ["L03"]], ["DNA / RNA / PNA", ["L07", "L09"]], ["MIP", ["L03"]]]
  },
  interface: {
    col: C.amber,
    text: "Interface: holds the recognizer on the surface and keeps it working.",
    members: [["Adsorption", ["L04"]], ["Entrapment", ["L04"]], ["Cross-linking", ["L04"]], ["Covalent linker", ["L04"]], ["Affinity", ["L04"]], ["Molecular imprint", ["L03"]]]
  },
  transducer: {
    col: C.violet,
    text: "Transducer: turns the binding into a signal you can measure.",
    members: [["Optical / SPR", ["L05"]], ["QCM", ["L03", "L05"]], ["SiNW-FET", ["L03", "L06"]], ["EG-FET", []], ["Electrochemical", ["L02", "L08"]], ["Photodiode", []]]
  }
};

let sel = null;
function draw() {
  const g = $("stack"); g.innerHTML = "";
  const op = l => !sel || sel === l ? 1 : 0.3;
  // transducer: violet bar
  const tr = el("g", {class:"layer", opacity:op("transducer")}, g);
  el("rect", {x:20, y:140, width:320, height:24, rx:5, fill:C.violet}, tr);
  txt("transducer", {x:180, y:156, "font-size":11, fill:"#0b1020", "text-anchor":"middle"}, tr);
  // interface: amber linkers
  const it = el("g", {class:"layer", opacity:op("interface")}, g);
  el("rect", {x:20, y:118, width:320, height:22, fill:"transparent"}, it);
  for (const x of [70, 140, 220, 290]) el("line", {x1:x, y1:122, x2:x, y2:140, stroke:C.amber, "stroke-width":3}, it);
  txt("interface", {x:338, y:134, "font-size":10, fill:C.amber, "text-anchor":"end"}, it);
  // recognizers: antibody (Y), enzyme (blob with notch), aptamer (folded strand), DNA probe (ladder)
  const rc = el("g", {class:"layer", opacity:op("recognizer")}, g);
  el("rect", {x:20, y:40, width:320, height:82, fill:"transparent"}, rc);
  el("path", {d:"M70 122 v-18 M70 104 l-12 -14 M70 104 l12 -14", stroke:C.cyan, "stroke-width":4, fill:"none", "stroke-linecap":"round"}, rc);
  el("ellipse", {cx:140, cy:110, rx:15, ry:11, fill:C.cyan}, rc);
  el("path", {d:"M135 99 L140 106 L145 99 Z", fill:"#0b1020"}, rc);   // active-site notch
  el("path", {d:"M220 122 c-14 -6 -14 -18 0 -20 c14 -2 14 -14 0 -18 c-10 -3 -6 -12 4 -12", stroke:C.cyan, "stroke-width":3, fill:"none", "stroke-linecap":"round"}, rc);
  el("path", {d:"M284 122 v-34 M296 122 v-34 M284 114 h12 M284 106 h12 M284 98 h12 M284 90 h12", stroke:C.cyan, "stroke-width":2.5, fill:"none"}, rc);
  txt("recognizer", {x:180, y:34, "font-size":11, fill:C.cyan, "text-anchor":"middle"}, rc);
  // analyte dots
  for (const [x, y] of [[54, 76], [86, 78], [140, 86], [232, 60], [300, 70], [110, 54], [256, 46]]) el("circle", {cx:x, cy:y, r:3, fill:C.tx, opacity:.8}, g);
  txt("analyte", {x:28, y:56, "font-size":9, fill:C.dim}, g);
  [["transducer", tr], ["interface", it], ["recognizer", rc]].forEach(([l, node]) => node.addEventListener("click", () => select(l)));
}
function select(l) {
  sel = l;
  draw();
  const L = LAYERS[l];
  $("cap").textContent = L.text;
  $("cap").style.color = L.col;
  const ul = $("members"); ul.innerHTML = "";
  for (const [name, lessons] of L.members) {
    const li = document.createElement("li");
    li.textContent = name;
    for (const id of lessons) {
      if (READY[id]) {
        const a = document.createElement("a");
        a.href = READY[id]; a.target = "_top"; a.textContent = id + " ↗";
        li.appendChild(a);
      } else {
        const s = document.createElement("span");
        s.className = "l"; s.textContent = id;
        li.appendChild(s);
      }
    }
    ul.appendChild(li);
  }
  document.querySelectorAll("[data-l]").forEach(b => b.classList.toggle("on", b.dataset.l === l));
}
document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => select(b.dataset.l));
const focus = new URLSearchParams(location.search).get("focus");
draw();
if (LAYERS[focus]) select(focus);
else $("cap").textContent = "Tap a layer to see what it can be made of.";
</script>
</body>
</html>
